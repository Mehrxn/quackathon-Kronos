server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      # Label ai-agent-backend container with service_name
      - source_labels: ['__meta_docker_container_name']
        regex: '.*(ai-agent-backend|dummyBackend).*'
        target_label: 'service_name'
        replacement: 'ai-agent-backend'
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: logger
            service_name: service_name
      - labels:
          level:
          logger:
          container:
          service_name:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
