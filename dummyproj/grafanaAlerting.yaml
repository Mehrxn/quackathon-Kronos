# Grafana alerting provisioning for Kronos.
#
# Drop this into Grafana's provisioning path so it loads on startup. For the
# containerized Grafana in your stack, mount it at:
#   /etc/grafana/provisioning/alerting/kronos.yaml
# e.g. in docker-compose:
#   volumes:
#     - ./grafana-alerting.yaml:/etc/grafana/provisioning/alerting/kronos.yaml:ro
# then restart the grafana container.
#
# IMPORTANT — two things you MUST verify before this works:
#
# 1. LOKI DATASOURCE UID. The rules reference datasourceUid: P8E80F9AEF21F6940. Your actual
#    UID may differ. Find it: Grafana (http://localhost:3001) -> Connections ->
#    Data sources -> Loki -> the UID is in the URL / settings. Replace every
#    "loki" datasourceUid below with that value, OR set the Loki datasource's
#    uid explicitly to "loki" in its own provisioning file.
#
# 2. LOG LABEL. Every query uses {service_name="ai-agent-backend"}. Confirm in Grafana
#    Explore (Loki -> label browser) that your logs actually carry app=...
#    If Promtail labels them container=... or service=..., change the selector
#    in all four expr blocks to match, and keep it consistent with
#    webhook.js's appName resolution.
#
# Each rule counts matching log lines in a 1m window and fires when > 0, with
# for: 0s so it triggers on the first occurrence (good for live demos).
# The alertname label on each rule is what webhook.js routes on.

apiVersion: 1

groups:
  - orgId: 1
    name: kronos-incidents
    folder: Kronos
    interval: 30s
    rules:
      # --- Segfault / crash -------------------------------------------------
      - uid: kronos-segfault
        title: Kronos Segfault Crash
        condition: threshold
        for: 0s
        labels:
          alertname: segfault
          app: dummyBackend
          container: ai-agent-backend
          priority: high
        annotations:
          summary: Segmentation fault (SIGSEGV) detected in dummyBackend
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(segfault|sigsegv|fatal|crash|dereference)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

      # --- Out of index -----------------------------------------------------
      - uid: kronos-outofindex
        title: Kronos Out Of Index
        condition: threshold
        for: 0s
        labels:
          alertname: outofindex
          app: dummyBackend
          container: ai-agent-backend
          priority: high
        annotations:
          summary: Index out of range / out of bounds detected in dummyBackend
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(indexerror|index out of range|out of bounds|outofindex)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

      # --- RAM / memory -----------------------------------------------------
      - uid: kronos-ram
        title: Kronos High RAM
        condition: threshold
        for: 0s
        labels:
          alertname: ram
          app: dummyBackend
          container: ai-agent-backend
          priority: medium
        annotations:
          summary: Critically high memory usage in dummyBackend
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(high ram alert|memory usage is critically|out of memory|oom)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

      # --- CPU / vCPU -------------------------------------------------------
      - uid: kronos-cpu
        title: Kronos High CPU
        condition: threshold
        for: 0s
        labels:
          alertname: cpu
          app: dummyBackend
          container: ai-agent-backend
          priority: medium
        annotations:
          summary: Critically high vCPU utilization in dummyBackend
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(high cpu alert|vcpu utilization|cpu throttl|throttle)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

---
# Contact point: where Grafana POSTs the alert. This points at your
# webhook-server container by its service name on the internal Docker network
# (container port 8080). If Grafana and webhook-server are NOT on the same
# network, use the host route instead: http://host.docker.internal:8085
apiVersion: 1

contactPoints:
  - orgId: 1
    name: kronos-webhook
    receivers:
      - uid: kronos-webhook-rcv
        type: webhook
        settings:
          url: http://webhook-server:8080
          httpMethod: POST

---
# Notification policy: route everything in the Kronos folder to the webhook,
# with minimal grouping delay so the demo fires promptly.
apiVersion: 1

policies:
  - orgId: 1
    receiver: kronos-webhook
    group_by: ["alertname"]
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 1h
    routes:
      - receiver: kronos-webhook
        matchers:
          - service_name = ai-agent-backend
        group_wait: 0s
        group_interval: 10s