apiVersion: 1

groups:
  - orgId: 1
    name: kronos-incidents
    folder: Kronos
    interval: 30s
    rules:
      # --- Segfault / crash -------------------------------------------------
      - uid: kronos-segfault
        title: Kronos Segfault Crash
        condition: threshold
        for: 0s
        labels:
          alertname: segfault
          app: dummyBackend
          container: ai-agent-backend
          priority: high
        annotations:
          summary: Segmentation fault (SIGSEGV) detected in dummyBackend
          description: '{{ $labels.container }} crashed with segfault'
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(segfault|sigsegv|fatal|crash|dereference)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

      # --- Out of index -----------------------------------------------------
      - uid: kronos-outofindex
        title: Kronos Out Of Index
        condition: threshold
        for: 0s
        labels:
          alertname: outofindex
          app: dummyBackend
          container: ai-agent-backend
          priority: high
        annotations:
          summary: Index out of range / out of bounds detected in dummyBackend
          description: '{{ $labels.container }} threw an IndexError or OutOfBoundsException'
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(indexerror|index out of range|out of bounds|outofindex)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

      # --- RAM / memory -----------------------------------------------------
      - uid: kronos-ram
        title: Kronos High RAM
        condition: threshold
        for: 0s
        labels:
          alertname: ram
          app: dummyBackend
          container: ai-agent-backend
          priority: medium
        annotations:
          summary: Critically high memory usage in dummyBackend
          description: '{{ $labels.container }} memory usage critical (>95%)'
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(high ram alert|memory usage is critically|out of memory|oom)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

      # --- CPU / vCPU -------------------------------------------------------
      - uid: kronos-cpu
        title: Kronos High CPU
        condition: threshold
        for: 0s
        labels:
          alertname: cpu
          app: dummyBackend
          container: ai-agent-backend
          priority: medium
        annotations:
          summary: Critically high vCPU utilization in dummyBackend
          description: '{{ $labels.container }} CPU throttling likely (>95%)'
        data:
          - refId: count
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="ai-agent-backend"} |~ "(?i)(high cpu alert|vcpu utilization|cpu throttl|throttle)" [1m]))'
              queryType: instant
              refId: count
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: count
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: threshold

---
# Contact point: where Grafana POSTs the alert.
# Points to Kronos /api/v1/init/ endpoint
apiVersion: 1

contactPoints:
  - orgId: 1
    name: kronos-webhook
    receivers:
      - uid: kronos-webhook-rcv
        type: webhook
        settings:
          url: http://kronos:8001/api/v1/init/
          httpMethod: POST

---
# Notification policy: route Kronos alerts to webhook
apiVersion: 1

policies:
  - orgId: 1
    receiver: kronos-webhook
    group_by: ['alertname']
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 1h
    routes:
      - receiver: kronos-webhook
        matchers:
          - service_name = ai-agent-backend
        group_wait: 0s
        group_interval: 10s
