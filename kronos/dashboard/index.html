<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos Server Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
        .card { background: #fafafa; padding: 1.5rem; border-radius: 6px; border: 1px solid #ddd; text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 1rem; color: #666; }
        .card .value { font-size: 1.5rem; font-weight: bold; color: #2c3e50; }
        .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #2ecc71; margin-right: 8px; }
        .status-dot.offline { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span id="status-indicator" class="status-dot"></span>Kronos Dashboard</h1>
        <p>Live server monitoring.</p>

        <div class="status-grid">
            <div class="card">
                <h3>Server Status</h3>
                <div class="value" id="server-status">Loading...</div>
            </div>
            <div class="card">
                <h3>Uptime</h3>
                <div class="value" id="server-uptime">--</div>
            </div>
            <div class="card">
                <h3>Active Tasks</h3>
                <div class="value" id="active-tasks">--</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                // Fetch data from our new status endpoint
                const response = await fetch('/api/status');
                const data = await response.json();

                document.getElementById('server-status').textContent = data.status;
                document.getElementById('server-uptime').textContent = data.uptime + 's';
                document.getElementById('active-tasks').textContent = data.active_tasks;
                
                document.getElementById('status-indicator').className = 'status-dot';
            } catch (error) {
                document.getElementById('server-status').textContent = 'Offline / Error';
                document.getElementById('status-indicator').className = 'status-dot offline';
            }
        }

        // Fetch immediately, then poll every 5 seconds
        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
